name: "Terraform Infrastructure Apply (Platform Team)"

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - "*.tf"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to execute"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - recreate-all
          - destroy-all
          - redeploy-databricks
          - destroy-databricks
      databricks_workspace_name:
        description: "Databricks workspace name override (e.g. adb-ratecard-dev-002)"
        required: false
        default: ""
      databricks_sku:
        description: "Databricks SKU override (trial or premium)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  terraform-apply:
    name: "Terraform Apply (Dev Environment)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout Platform Infra Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply / Redeploy Databricks
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.databricks_workspace_name }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -var=databricks_workspace_name=${{ inputs.databricks_workspace_name }}"
          fi
          if [ -n "${{ inputs.databricks_sku }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -var=databricks_sku=${{ inputs.databricks_sku }}"
          fi

          if [ "${{ inputs.action }}" = "destroy-all" ]; then
            echo "Destroying ALL infrastructure in dev environment..."
            terraform apply -destroy $EXTRA_ARGS -auto-approve
          elif [ "${{ inputs.action }}" = "recreate-all" ]; then
            echo "Step 1/2: Destroying ALL existing infrastructure in dev environment..."
            terraform apply -destroy $EXTRA_ARGS -auto-approve
            echo "Waiting 45s for Azure Storage data-plane DNS to flush before recreating..."
            sleep 45
            echo "Step 2/2: Recreating ALL infrastructure from scratch..."
            terraform apply $EXTRA_ARGS -auto-approve
          elif [ "${{ inputs.action }}" = "destroy-databricks" ]; then
            echo "Destroying expired Databricks workspace..."
            terraform apply -destroy -target=module.databricks.azurerm_databricks_workspace.adb $EXTRA_ARGS -auto-approve
          elif [ "${{ inputs.action }}" = "redeploy-databricks" ]; then
            echo "Redeploying Databricks workspace (forcing replacement of expired workspace)..."
            terraform apply -replace=module.databricks.azurerm_databricks_workspace.adb $EXTRA_ARGS -auto-approve
          else
            echo "Untainting storage account if already provisioned in Azure..."
            terraform untaint module.storage.azurerm_storage_account.lakehouse || true
            echo "Applying Terraform configuration..."
            terraform apply $EXTRA_ARGS -auto-approve
          fi

