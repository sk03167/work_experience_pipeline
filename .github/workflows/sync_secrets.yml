name: "Sync Enterprise Secrets to Azure Key Vault (SecOps / Platform)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to sync secrets to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  sync-secrets:
    name: "Sync Secrets to Key Vault (${{ inputs.environment }})"
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      KEY_VAULT_NAME: "kv-ratecard-dev-sk01"

    steps:
      - name: Log in to Azure via Service Principal
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}"
            }

      - name: Sync OLTP Database Password
        run: |
          echo "Pushing secret 'oltp-db-password' to $KEY_VAULT_NAME..."
          az keyvault secret set \
            --vault-name "$KEY_VAULT_NAME" \
            --name "oltp-db-password" \
            --value "${{ secrets.NEON_DB_PASSWORD }}" \
            --output none
          echo "Successfully synced 'oltp-db-password' to $KEY_VAULT_NAME."

      - name: Sync OLTP Connection String (Full URI)
        run: |
          if [ -n "${{ secrets.NEON_DATABASE_URL }}" ]; then
            echo "Pushing secret 'oltp-database-url' to $KEY_VAULT_NAME..."
            az keyvault secret set \
              --vault-name "$KEY_VAULT_NAME" \
              --name "oltp-database-url" \
              --value "${{ secrets.NEON_DATABASE_URL }}" \
              --output none
            echo "Successfully synced 'oltp-database-url' to $KEY_VAULT_NAME."
          fi

